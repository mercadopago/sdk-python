# This workflow will install Python dependencies and upload a version in the PyPI
name: CD - Upload PyPI

on:
  release:
    types: [ published ]

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v7

      # Sets up python
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v7
        with:
          python-version: 3.12

      # Install dependencies
      - name: "Installs dependencies"
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install setuptools build twine
          python3 -m pip install .

      # Build and upload to PyPI
      - name: "Builds and uploads to PyPI"
        run: |
          python3 -m build
          python3 -m twine check dist/*
          python3 -m twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
